# Batas akses resource /threads: 90 permintaan per menit untuk setiap alamat IP.
limit_req_zone $binary_remote_addr zone=threads:10m rate=90r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /threads {
        # burst=89 nodelay: 90 permintaan dapat dilayani sekaligus, setelah itu 90 permintaan per menit; selebihnya ditolak (503).
        limit_req zone=threads burst=89 nodelay;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
